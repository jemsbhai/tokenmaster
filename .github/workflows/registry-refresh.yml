name: Model registry drift

on:
  schedule:
    # Weekly, with an intentionally non-round minute to reduce scheduler load.
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-official-openai-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate the offline parser and safety fixtures
        env:
          PYTHONPATH: python/tokenmaster/src
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest python/tokenmaster/tests/test_registry_refresh.py -q

      - name: Compare bundled data with official documentation
        id: registry-check
        continue-on-error: true
        env:
          PYTHONPATH: python/tokenmaster/src
        run: >-
          python -m tokenmaster.registry_refresh check
          --registry python/tokenmaster/src/tokenmaster/data/models.json
          --repo-root .
          --report model-registry-report.json

      - name: Upload the reviewable report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: model-registry-report
          path: model-registry-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail when tracked data or generated copies drift
        if: steps.registry-check.outcome == 'failure'
        run: exit 1
